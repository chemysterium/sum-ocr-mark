# Copy this file to config.ini and fill in your own values.
# config.ini is gitignored so your credentials never end up in a repository.
# Environment variables with the same (uppercased) names override these values.

[lmstudio]
# Base URL of your local LM Studio server (Developer tab -> Start Server).
lmstudio_url = http://localhost:1234

# Model used for summaries. Must be loaded, or loadable, in LM Studio.
chat_model = google/gemma-4-26b-a4b-qat

# Vision model used to OCR pages that have no text layer.
ocr_model = deepseek-ocr-2

[zotero]
# Only needed for the --zotero-* sources.
# Your numeric Zotero user ID and an API key with read/write access,
# both from https://www.zotero.org/settings/keys
zotero_library_id = 1234567
zotero_api_key = your-zotero-api-key-here

# "user" for your personal library, "group" for a group library
zotero_library_type = user

# Local Zotero storage folder. PDFs are read from here, which is what makes
# per-page OCR possible; without a local file only Zotero's indexed plain
# text is available. Defaults to ~/Zotero/storage if omitted.
# zotero_storage_dir = C:\Users\you\Zotero\storage
